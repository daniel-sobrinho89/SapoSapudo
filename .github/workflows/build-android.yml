name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verificar Java
        run: |
          java -version
          echo $JAVA_HOME

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libjpeg-dev \
            libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            build-essential ccache libltdl-dev

      - name: Gerar módulo Gemini
        env:
          APP_GEMINI_API_KEY: ${{ secrets.APP_GEMINI_API_KEY }}
        run: |
          python << 'EOF'
          import os

          chave = os.environ.get("APP_GEMINI_API_KEY")

          if not chave:
              raise RuntimeError(
                  "APP_GEMINI_API_KEY não definida no GitHub Secrets"
              )

          with open("config_gemini.py", "w", encoding="utf-8") as f:
              f.write(f"GEMINI_API_KEY = {chave!r}\n")

          print("config_gemini.py criado")
          EOF

      - name: Instalar Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Baixar fontes b9752
        run: |
          git clone https://github.com/ggml-org/llama.cpp.git llama_src

          cd llama_src

          git checkout b9752

      - name: Compilar llama.cpp Android
        run: |

          cd llama_src

          cmake -S . -B build-android \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-34 \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_CPU=ON \
            -DGGML_OPENMP=OFF

          cmake --build build-android -j4

          echo "LIBS GERADAS:"
          find build-android -name "*.so" | sort

      - name: Copiar libs compiladas
        run: |

          mkdir -p domains/conversas/libs/arm64-v8a

          find llama_src/build-android -name "libllama.so" -exec cp {} domains/conversas/libs/arm64-v8a/ \;

          find llama_src/build-android -name "libggml*.so" -exec cp {} domains/conversas/libs/arm64-v8a/ \;

          ls -lh domains/conversas/libs/arm64-v8a

      - name: Compilar Qwen JNI Bridge
        run: |

          $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang++ \
            -shared \
            -fPIC \
            -Illama_src/include \
            -Illama_src/ggml/include \
            -I$JAVA_HOME/include \
            -I$JAVA_HOME/include/linux \
            -I$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include \
            -I$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/aarch64-linux-android \
            domains/conversas/llama_jni.cpp \
            -Ldomains/conversas/libs/arm64-v8a \
            -Wl,-rpath,'$ORIGIN' \
            -lllama \
            -llog \
            -o domains/conversas/libs/arm64-v8a/libllama_jni.so

          echo "VALIDANDO JNI"

          nm -D domains/conversas/libs/arm64-v8a/libllama_jni.so | grep Java_domains_voz_java_QwenBridge_loadModel

          nm -D domains/conversas/libs/arm64-v8a/libllama_jni.so | grep Java_domains_voz_java_QwenBridge_generate__JLjava_lang_String_2Ljava_lang_String_2I

          nm -D domains/conversas/libs/arm64-v8a/libllama_jni.so | grep Java_domains_voz_java_QwenBridge_release

      - name: Limpar fontes llama
        run: |
          rm -rf llama_src

      - name: Procurar libc++_shared.so
        run: |
          find $ANDROID_NDK_LATEST_HOME -name libc++_shared.so

      - name: Copiar libc++_shared.so
        run: |
          cp \
            $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so \
            domains/conversas/libs/arm64-v8a/

      - name: Baixar modelo Qwen oficial
        run: |
          mkdir -p domains/conversas

          curl -L \
            https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q8_0.gguf \
            -o domains/conversas/qwen2.5-1.5b-instruct-q8_0.gguf

          ls -lh domains/conversas/qwen2.5-1.5b-instruct-q8_0.gguf
      
      - name: Listar libs finais
        run: |
          ls -lh domains/conversas/libs/arm64-v8a

      - name: Ver dependências JNI
        run: |
          readelf -d domains/conversas/libs/arm64-v8a/libllama_jni.so | grep NEEDED

      - name: Ver dependências todas libs
        run: |
          for f in domains/conversas/libs/arm64-v8a/*.so
          do
            echo "=============="
            echo $f
            readelf -d $f | grep NEEDED
          done

      - name: Gerar APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk