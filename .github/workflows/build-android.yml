name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verificar Java
        run: |
          java -version
          echo $JAVA_HOME

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libjpeg-dev \
            libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            build-essential ccache libltdl-dev

      - name: Injetar Gemini Key
        env:
          APP_GEMINI_API_KEY: ${{ secrets.APP_GEMINI_API_KEY }}
        run: |
          sed -i "s|android.add_env = GEMINI_API_KEY=|android.add_env = GEMINI_API_KEY=$APP_GEMINI_API_KEY|" buildozer.spec
          
      - name: Verificar substituição
        run: |
          grep "android.add_env" buildozer.spec

          if grep -q '\${APP_GEMINI_API_KEY}' buildozer.spec; then
            echo "ERRO: variável não substituída"
            exit 1
          fi

          echo "OK: variável substituída"

      - name: Instalar Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Gerar APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk