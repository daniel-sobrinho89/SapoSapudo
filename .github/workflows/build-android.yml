name: Build APK

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-22.04

steps:
  - uses: actions/checkout@v4

  - uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Verificar Java
    run: |
      java -version
      echo $JAVA_HOME

  - name: Instalar dependências
    run: |
      sudo apt-get update
      sudo apt-get install -y \
        git zip unzip \
        autoconf libtool pkg-config \
        zlib1g-dev libjpeg-dev \
        libncurses5-dev libncursesw5-dev \
        cmake libffi-dev libssl-dev \
        build-essential ccache libltdl-dev

  - name: Gerar módulo Gemini
    env:
      APP_GEMINI_API_KEY: ${{ secrets.APP_GEMINI_API_KEY }}
    run: |
      python << 'EOF'
      import os

      chave = os.environ.get("APP_GEMINI_API_KEY")

      if not chave:
          raise RuntimeError(
              "APP_GEMINI_API_KEY não definida no GitHub Secrets"
          )

      with open("config_gemini.py", "w", encoding="utf-8") as f:
          f.write(f"GEMINI_API_KEY = {chave!r}\n")

      print("config_gemini.py criado")
      EOF

  - name: Validar módulo Gemini
    run: |
      python << 'EOF'
      import importlib.util

      spec = importlib.util.spec_from_file_location(
          "config_gemini",
          "config_gemini.py"
      )

      module = importlib.util.module_from_spec(spec)
      spec.loader.exec_module(module)

      assert hasattr(module, "GEMINI_API_KEY")
      assert module.GEMINI_API_KEY
      assert len(module.GEMINI_API_KEY) > 20

      print("OK: módulo importado")
      print("Prefixo:", module.GEMINI_API_KEY[:8] + "...")
      print("Tamanho:", len(module.GEMINI_API_KEY))
      EOF

  - name: Instalar Buildozer
    run: |
      pip install --upgrade pip
      pip install buildozer==1.5.0 cython==0.29.36

  - name: Gerar APK
    run: |
      buildozer android debug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: apk
      path: bin/*.apk