name: Build APK

on:
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verificar Java
        run: |
          java -version
          echo $JAVA_HOME

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libjpeg-dev \
            libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            build-essential ccache libltdl-dev

      - name: Gerar módulo Gemini
        env:
          APP_GEMINI_API_KEY: ${{ secrets.APP_GEMINI_API_KEY }}
        run: |
          python << 'EOF'
          import os

          chave = os.environ.get("APP_GEMINI_API_KEY")

          if not chave:
              raise RuntimeError(
                  "APP_GEMINI_API_KEY não definida no GitHub Secrets"
              )

          with open("config_gemini.py", "w", encoding="utf-8") as f:
              f.write(f"GEMINI_API_KEY = {chave!r}\n")

          print("config_gemini.py criado")
          EOF

      - name: Instalar Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Atualizar versão Android
        run: |

          VERSION="1.0.$GITHUB_RUN_NUMBER"

          sed -i \
            "s/^android.numeric_version *= *.*/android.numeric_version = $GITHUB_RUN_NUMBER/" \
            buildozer.spec

          sed -i \
            "s/^version *= *.*/version = $VERSION/" \
            buildozer.spec

          echo "Version:"
          grep "^version" buildozer.spec

          echo "VersionCode:"
          grep "^android.numeric_version" buildozer.spec

      - name: Reconstruir Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > saposapudo.keystore

      - name: Validar Keystore
        run: |
          ls -lah saposapudo.keystore

          keytool \
            -list \
            -v \
            -keystore saposapudo.keystore \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}"

      - name: Gerar Release
        env:
          P4A_RELEASE_KEYSTORE: ${{ github.workspace }}/saposapudo.keystore
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: saposapudo
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.KEYSTORE_PASSWORD }}

        run: |
          buildozer android release

      - name: Listar APKs
        run: |
          ls -lah bin

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SapoSapudo-${{ github.run_number }}
          path: bin/*.apk