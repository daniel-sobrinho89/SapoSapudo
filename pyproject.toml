[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM"
]

ignore = [
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"core/event_bus.py" = ["UP006", "UP035"]
"domains/conversas/personalidade_sapudo.py" = ["E501"]
"application/fabrica_controladores.py" = ["E501"]
"scripts/patch_pygbag_template.py" = ["E501"]
"main_web.py" = ["E402"]
"tests/integration/visual/scene_view.py" = ["E501"]
"tests/integration/visual/report.py" = ["E501"]
"tests/integration/runner.py" = ["E501"]
"tests/integration/scenarios/gathering.py" = ["E501"]
"tests/integration/visual/real_scene.py" = ["E501"]
"application/usecases/conversa/controlar_conversa.py" = ["E501"]
"render/world_debug_renderer.py" = ["E501"]
"render/world_editor_renderer.py" = ["E501"]
"application/cenario.py" = ["E501"]
"application/coordenador_estado_jogo.py" = ["E501"]
